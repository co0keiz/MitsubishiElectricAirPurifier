[project]
name = "ma-ew85s-local"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.11", "cryptography>=44"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=1", "pytest-aiohttp>=1"]
ha-test = ["pytest-homeassistant-custom-component==0.13.373"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = ["ha: requires Home Assistant test dependencies (Linux, Python 3.14)"]

[tool.setuptools.packages.find]
include = ["custom_components*"]
